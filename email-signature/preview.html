<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>After Class signature preview</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #e8e8e8;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      color: #222;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #666; font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 40px;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 4px;
    }
    .label {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 16px;
    }
    .ref img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>After Class email signatures</h1>
  <p>Left is HTML. Right is your PNG export baseline. Open jc.html / seth.html to copy the table into Gmail or Outlook.</p>

  <div class="grid">
    <div class="card">
      <div class="label">JC · HTML</div>
      <iframe src="jc.html" title="JC HTML" style="width:100%;height:160px;border:0;overflow:hidden;"></iframe>
    </div>
    <div class="card ref">
      <div class="label">JC · baseline PNG</div>
      <img src="baseline/jc-ref.png" alt="JC reference" />
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Seth · HTML</div>
      <iframe src="seth.html" title="Seth HTML" style="width:100%;height:160px;border:0;overflow:hidden;"></iframe>
    </div>
    <div class="card ref">
      <div class="label">Seth · baseline PNG</div>
      <img src="baseline/seth-ref.png" alt="Seth reference" />
    </div>
  </div>
</body>
</html>
