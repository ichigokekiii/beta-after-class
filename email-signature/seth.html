<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>After Class — Seth signature</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
  <!--
    Paste the outer table below into your email client signature settings.
    Host assets/logo-mark@2x.png at a public URL and put that URL in the img src.
    Display size stays width="113" height="80".

    Designer lock (from seth signature.png @ logo 80px):
    - Pink rule is the spine, 107px tall
    - Mark + type sit IN the rule, not flush to its top (~12px air above)
    - Name ink lines up with the top of the butterfly
    - Identity block (name/title) and contact block (phone/email) with a clear gap
  -->
  <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;border-spacing:0;mso-table-lspace:0pt;mso-table-rspace:0pt;">
    <tr>
      <!-- 12px = air above logo inside the rule -->
      <td style="padding:12px 33px 15px 0;vertical-align:top;">
        <img
          src="assets/logo-mark@2x.png"
          width="113"
          height="80"
          alt="After Class"
          style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;"
        />
      </td>
      <td style="padding:0;vertical-align:top;">
        <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
          <tr>
            <td style="width:4px;height:107px;background-color:#F39394;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
        </table>
      </td>
      <!-- 9px top: name ink (~3px into line box) lands ~12px below rule top, with logo -->
      <td style="padding:9px 0 0 26px;vertical-align:top;font-family:Helvetica Neue, Helvetica, Arial, sans-serif;">
        <div style="height:23px;font-size:18px;line-height:18px;font-weight:700;color:#000000;">Seth Bernard Planco</div>
        <div style="height:36px;font-size:16px;line-height:16px;font-weight:400;color:#F39394;">Co-Founder, CTO</div>
        <div style="height:16px;font-size:14px;line-height:14px;font-weight:400;color:#9F9F9F;">
          <a href="tel:+639614404370" style="color:#9F9F9F;text-decoration:none;">(+63) 961 440 4370</a>
        </div>
        <div style="font-size:14px;line-height:14px;font-weight:400;color:#9F9F9F;">
          <a href="mailto:seth@afterclassapp.com" style="color:#9F9F9F;text-decoration:none;">seth@afterclassapp.com</a>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
